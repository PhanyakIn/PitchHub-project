<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | PitchHub</title>
    <link rel="stylesheet" href="CSS-Auth/auth-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div id="site-nav"></div>
    <main class="auth-main">
        <section class="auth-card" aria-labelledby="login-title">
            <h1 id="login-title">เข้าสู่ระบบ</h1>
            <p>เข้าสู่ระบบเพื่อจองสนามฟุตบอล</p>
            <p id="auth-message" class="auth-message" hidden role="status"></p>
            <form class="auth-form" id="auth-form">
                <label for="email">อีเมล<input id="email" name="email" type="email" autocomplete="email" required></label>
                <label for="password">รหัสผ่าน<input id="password" name="password" type="password" autocomplete="current-password" required></label>
                <button class="auth-submit" type="submit">เข้าสู่ระบบ</button>
            </form>
            <p class="auth-switch">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
        </section>
    </main>
    <script src="JS-Core-system/pages-handler.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS-Core-system/supabase-config.js"></script>
    <script src="JS-Core-system/auth-handler.js"></script>
</body>
</html>
