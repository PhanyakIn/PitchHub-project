<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Account | PitchHub</title>
	<link rel="stylesheet" href="CSS-Auth/account.css">
	<link rel="stylesheet" href="CSS-Auth/pages-transition.css">
	<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
	<div id="site-nav"></div>
	<main class="account-main">
		<section class="account-card" aria-labelledby="account-title">
			<div class="account-heading">
				<div>
					<p class="account-eyebrow">PitchHub account</p>
					<h1 id="account-title">บัญชีของฉัน</h1>
				</div>
				<button class="logout-btn" type="button"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i> ออกจากระบบ</button>
			</div>
			<div class="account-profile">
				<span class="profile-icon profile-avatar" aria-hidden="true">?</span>
				<div><strong class="account-name">กำลังโหลด...</strong><span class="account-email"></span></div>
			</div>
			<p class="account-message" role="status"></p>
			<section class="booking-history" aria-labelledby="history-title">
				<h2 id="history-title">ประวัติการจอง</h2>
				<div class="booking-list"></div>
			</section>
		</section>
	</main>
	<script src="JS-Core-system/pages-handler.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="JS-Core-system/supabase-config.js"></script>
	<script src="JS-Core-system/auth-nav-handler.js"></script>
	<script src="JS-Core-system/account-handler.js"></script>
</body>
</html>
